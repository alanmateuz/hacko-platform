# Testa todo PR e publica hacko.com.br a cada merge na main.
name: Testar e publicar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Nunca interromper uma publicação no meio (migração + deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # IDs não são segredos: o banco D1 de produção e o domínio.
  HACKO_D1_ID: 5076d901-ea9f-4ccb-a581-1a90b98f3213
  HACKO_DOMAIN: hacko.com.br

jobs:
  test:
    name: Testes e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: Publicar em hacko.com.br
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hacko.com.br
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Migrações antes do código novo, para o código já encontrar as tabelas/colunas de que precisa.
      - name: Aplicar migrações do banco
        run: npx wrangler d1 migrations apply hacko-db --remote --config dist/server/wrangler.json
      - name: Publicar
        run: npx wrangler deploy --config dist/server/wrangler.json
